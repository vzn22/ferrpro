<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>ProAlmoxarife — Registro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#09090b;--ink1:#111116;--ink2:#18181f;--ink3:#22222d;
  --wire:rgba(255,255,255,.07);--wire2:rgba(255,255,255,.12);
  --gold:#e8a020;--gold2:#ffbe4d;--gold-g:rgba(232,160,32,.13);
  --rose:#f43f5e;--rose-g:rgba(244,63,94,.13);
  --lime:#84cc16;--lime-g:rgba(132,204,22,.13);
  --violet:#a78bfa;--violet-g:rgba(167,139,250,.13);
  --sky:#38bdf8;--sky-g:rgba(56,189,248,.13);
  --snow:#fafafa;--mist:#71717a;--fog:#3f3f46;
  --sans:'Figtree',sans-serif;--disp:'Bebas Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--snow);font-family:var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
.topbar{position:sticky;top:0;z-index:100;background:rgba(9,9,11,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--wire);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;background:var(--gold);border-radius:8px;display:grid;place-items:center;font-size:15px;box-shadow:0 0 18px rgba(232,160,32,.4)}
.brand-text{font-family:var(--disp);font-size:19px;letter-spacing:1.5px}
.brand-text em{color:var(--gold);font-style:normal}
.back-btn{background:none;border:1px solid var(--wire2);color:var(--mist);font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--sans);text-decoration:none}
.main{padding:16px 14px 40px;max-width:700px;margin:0 auto;position:relative;z-index:1}
.page-title{font-family:var(--disp);font-size:26px;letter-spacing:1px;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--mist);margin-bottom:16px}
.tabs{display:flex;background:var(--ink2);border:1px solid var(--wire);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:none;border-radius:9px;background:none;color:var(--fog);font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.5px}
.tab.on{background:var(--ink3);color:var(--snow);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sw{position:relative}
.sw::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--fog);pointer-events:none;font-size:11px}
.fs{width:100%;background:var(--ink2);border:1px solid var(--wire2);border-radius:10px;padding:11px 30px 11px 13px;color:var(--snow);font-family:var(--sans);font-size:13px;font-weight:500;outline:none;-webkit-appearance:none;appearance:none}
.fs:focus{border-color:var(--gold)}
.busca{display:flex;align-items:center;background:var(--ink2);border:1px solid var(--wire2);border-radius:10px;padding:0 13px;margin-bottom:12px}
.busca:focus-within{border-color:var(--gold)}
.busca input{flex:1;background:none;border:none;color:var(--snow);font-family:var(--sans);font-size:14px;padding:12px 0 12px 9px;outline:none}
.busca input::placeholder{color:var(--fog)}
.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-sm{background:var(--ink2);border:1px solid var(--wire);border-radius:12px;padding:12px;text-align:center}
.stat-sm-val{font-family:var(--disp);font-size:26px;letter-spacing:-1px;line-height:1}
.stat-sm-lbl{font-size:10px;color:var(--mist);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.export-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.btn-sheets{background:#0f9d58;color:#fff;border:none;border-radius:10px;padding:12px;font-family:var(--disp);font-size:14px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-csv{background:var(--ink3);color:var(--snow);border:1px solid var(--wire2);border-radius:10px;padding:12px;font-family:var(--disp);font-size:14px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-sheets:active,.btn-csv:active{transform:scale(.975)}
.count-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.count-txt{font-size:12px;color:var(--mist)}
.count-num{font-family:var(--disp);font-size:14px;color:var(--gold2)}
.reg-item{background:var(--ink2);border:1px solid var(--wire);border-radius:14px;padding:15px;margin-bottom:10px;border-left:4px solid var(--rose)}
.reg-item.dev{border-left-color:var(--lime)}
.reg-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px}
.reg-nome{font-size:15px;font-weight:700;flex:1}
.reg-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.reg-badge{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:20px}
.b-aberto{background:var(--rose-g);color:var(--rose)}
.b-dev{background:var(--lime-g);color:var(--lime)}
.reg-qtd{font-family:var(--disp);font-size:18px;color:var(--gold2)}
.reg-infos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ri-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--fog);margin-bottom:2px}
.ri-val{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datas{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--ink3);border-radius:10px;overflow:hidden}
.data-col{padding:12px}
.data-col:first-child{border-right:1px solid var(--wire)}
.dc-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.lbl-saida{color:var(--rose)}
.lbl-dev{color:var(--lime)}
.dc-data{font-size:14px;font-weight:700}
.dc-hora{font-size:11px;color:var(--mist);margin-top:1px}
.dc-nd{font-size:13px;color:var(--fog);font-style:italic}
.tempo{text-align:center;margin-top:8px;font-size:11px;color:var(--mist)}
.obs{margin-top:8px;font-size:11px;color:var(--mist);background:var(--ink3);padding:7px 10px;border-radius:8px}
.sheets-msg{display:none;background:rgba(15,157,88,.1);border:1px solid rgba(15,157,88,.25);border-radius:12px;padding:14px;margin-bottom:12px;font-size:13px;color:#0f9d58;line-height:1.6}
.empty{text-align:center;padding:40px;color:var(--fog)}
.empty-ico{font-size:40px;margin-bottom:10px;display:block;opacity:.3}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">🔨</div>
    <div class="brand-text">Pro<em>Almoxarife</em></div>
  </div>
  <a href="app.html" class="back-btn">← Voltar</a>
</div>

<div class="main">
  <div class="page-title">📋 Registro</div>
  <div class="page-sub">Saídas e devoluções por funcionário</div>

  <div class="tabs">
    <button class="tab on" onclick="setTipo('ferr',this)">🔧 Ferramentas</button>
    <button class="tab" onclick="setTipo('epi',this)">🦺 EPIs</button>
    <button class="tab" onclick="setTipo('todos',this)">📋 Todos</button>
  </div>

  <div class="filtros">
    <div class="sw"><select id="f-status" class="fs"><option value="todos">Todos</option><option value="aberto">🔴 Em aberto</option><option value="devolvido">✅ Devolvidos</option></select></div>
    <div class="sw"><select id="f-periodo" class="fs"><option value="todos">Todo período</option><option value="hoje">Hoje</option><option value="semana">Esta semana</option><option value="mes" selected>Este mês</option></select></div>
    <div class="sw"><select id="f-obra" class="fs"><option value="todas">Todas obras</option></select></div>
    <div class="sw"><select id="f-func" class="fs"><option value="todos">Todos funcs.</option></select></div>
  </div>

  <div class="busca">
    <span style="color:var(--fog)">⌕</span>
    <input id="busca" placeholder="Buscar ferramenta, funcionário, obra...">
  </div>

  <div class="stats-bar">
    <div class="stat-sm"><div class="stat-sm-val" id="st-t" style="color:var(--gold2)">0</div><div class="stat-sm-lbl">Total</div></div>
    <div class="stat-sm"><div class="stat-sm-val" id="st-a" style="color:var(--rose)">0</div><div class="stat-sm-lbl">Em Aberto</div></div>
    <div class="stat-sm"><div class="stat-sm-val" id="st-d" style="color:var(--lime)">0</div><div class="stat-sm-lbl">Devolvidos</div></div>
  </div>

  <div class="export-row">
    <button class="btn-sheets" onclick="abrirSheets()">📊 Abrir no Sheets</button>
    <button class="btn-csv" onclick="baixarCSV()">📥 Baixar CSV</button>
  </div>

  <div class="sheets-msg" id="smsg">
    ✅ <strong>Arquivo baixado!</strong> No Google Sheets: <strong>Arquivo → Importar → Upload</strong> → selecione o CSV → <strong>Importar dados</strong>
    <button onclick="document.getElementById('smsg').style.display='none'" style="float:right;background:none;border:none;color:#0f9d58;cursor:pointer;font-size:16px">✕</button>
  </div>

  <div class="count-bar">
    <span class="count-txt">Mostrando</span>
    <span class="count-num" id="cnt">0 registros</span>
  </div>

  <div id="lista"><div class="empty"><span class="empty-ico">📋</span>Nenhum registro ainda</div></div>
</div>

<script>
let db={fsaidas:[],fentradas:[],esaidas:[],eentradas:[],obras:[],funcionarios:[]};
let tipo='ferr';

function load(){
  // Tentar todas as chaves possíveis do localStorage
  const keys=['ferrpro_local','ferrpro_v4','ferrpro_v3'];
  for(const k of keys){
    try{
      const r=localStorage.getItem(k);
      if(!r) continue;
      const parsed=JSON.parse(r);
      const d=parsed.db||parsed;
      if(d.fsaidas||d.esaidas){
        db.fsaidas    = d.fsaidas   ||[];
        db.fentradas  = d.fentradas ||[];
        db.esaidas    = d.esaidas   ||[];
        db.eentradas  = d.eentradas ||[];
        db.obras      = d.obras     ||[];
        db.funcionarios=d.funcionarios||[];
        break;
      }
    }catch(e){}
  }

  // Preencher filtros de obra e funcionário
  const fo=document.getElementById('f-obra');
  const ff=document.getElementById('f-func');
  db.obras.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;fo.appendChild(op)});
  db.funcionarios.forEach(f=>{const op=document.createElement('option');op.value=f;op.textContent=f;ff.appendChild(op)});

  render();
}

function setTipo(t,btn){
  tipo=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function parseD(v){
  if(!v) return new Date(0);
  const d=new Date(v);
  if(!isNaN(d)) return d;
  const p=v.split('/');
  if(p.length===3) return new Date(p[2],p[1]-1,p[0]);
  return new Date(0);
}

function getPares(){
  // Montar listas
  let S=[],E=[];
  if(tipo==='ferr'||tipo==='todos'){
    S=[...S,...db.fsaidas.map(x=>({...x,_i:x.ferramenta||x.ferramenta_nome,_q:+(x.qtd||x.quantidade||0),_c:'ferr'}))];
    E=[...E,...db.fentradas.map(x=>({...x,_i:x.ferramenta||x.ferramenta_nome,_q:+(x.qtd||x.quantidade||0),_c:'ferr'}))];
  }
  if(tipo==='epi'||tipo==='todos'){
    S=[...S,...db.esaidas.map(x=>({...x,_i:x.epi||x.epi_nome,_q:+(x.qtd||x.quantidade||0),_c:'epi'}))];
    E=[...E,...db.eentradas.map(x=>({...x,_i:x.epi||x.epi_nome,_q:+(x.qtd||x.quantidade||0),_c:'epi'}))];
  }

  // Filtro período
  const p=document.getElementById('f-periodo').value;
  if(p!=='todos'){
    const hoje=new Date();hoje.setHours(23,59,59,999);
    const ini=new Date();
    if(p==='hoje') ini.setHours(0,0,0,0);
    else if(p==='semana') ini.setDate(hoje.getDate()-7);
    else if(p==='mes'){ini.setDate(1);ini.setHours(0,0,0,0);}
    S=S.filter(x=>{const d=parseD(x.created_at||x.data);return d>=ini&&d<=hoje});
  }

  // Outros filtros
  const obra=document.getElementById('f-obra').value;
  const func=document.getElementById('f-func').value;
  const busca=document.getElementById('busca').value.toLowerCase();
  if(obra!=='todas') S=S.filter(x=>x.obra===obra);
  if(func!=='todos') S=S.filter(x=>x.funcionario===func);
  if(busca) S=S.filter(x=>(x._i||'').toLowerCase().includes(busca)||(x.funcionario||'').toLowerCase().includes(busca)||(x.obra||'').toLowerCase().includes(busca));

  // Parear
  const pares=S.map(s=>{
    const e=E.find(en=>(en._i||'')===(s._i||'')&&(en.funcionario||'')===(s.funcionario||'')&&(en.obra||'')===(s.obra||'')&&parseD(en.created_at||en.data)>=parseD(s.created_at||s.data));
    return{s,e:e||null,dev:!!e};
  });

  // Filtro status
  const st=document.getElementById('f-status').value;
  const fil=st==='aberto'?pares.filter(p=>!p.dev):st==='devolvido'?pares.filter(p=>p.dev):pares;

  // Ordenar
  fil.sort((a,b)=>{
    if(!a.dev&&b.dev) return -1;
    if(a.dev&&!b.dev) return 1;
    return parseD(b.s.created_at||b.s.data)-parseD(a.s.created_at||a.s.data);
  });

  return fil;
}

function render(){
  const pares=getPares();
  const ab=pares.filter(p=>!p.dev).length;
  const dv=pares.filter(p=>p.dev).length;
  document.getElementById('st-t').textContent=pares.length;
  document.getElementById('st-a').textContent=ab;
  document.getElementById('st-d').textContent=dv;
  document.getElementById('cnt').textContent=pares.length+' registro'+(pares.length!==1?'s':'');

  const el=document.getElementById('lista');
  if(!pares.length){el.innerHTML='<div class="empty"><span class="empty-ico">📋</span>Nenhum registro encontrado</div>';return;}

  el.innerHTML=pares.map(({s,e,dev})=>{
    const isEpi=s._c==='epi';
    let dias='';
    if(dev&&e){const ds=parseD(s.created_at||s.data),de=parseD(e.created_at||e.data);const d=Math.ceil((de-ds)/(1000*60*60*24));dias=d===0?'mesmo dia':`${d} dia${d!==1?'s':''}`;}
    return`<div class="reg-item${dev?' dev':''}">
      <div class="reg-top">
        <div class="reg-nome">${isEpi?'🦺':'🔧'} ${s._i||'—'}</div>
        <div class="reg-right">
          <div class="reg-badge ${dev?'b-dev':'b-aberto'}">${dev?'✅ Devolvido':'🔴 Em aberto'}</div>
          <div class="reg-qtd">${s._q} un</div>
        </div>
      </div>
      <div class="reg-infos">
        <div><div class="ri-lbl">👷 Funcionário</div><div class="ri-val">${s.funcionario||'—'}</div></div>
        <div><div class="ri-lbl">🏗️ Obra</div><div class="ri-val">${s.obra||'—'}</div></div>
        <div><div class="ri-lbl">👔 Responsável</div><div class="ri-val">${s.responsavel||'—'}</div></div>
        <div><div class="ri-lbl">🏷️ ${isEpi?'Categoria':'Tipo'}</div><div class="ri-val">${isEpi?(s.cat||'—'):(s.tipo||s.tipo_ferramenta||'—')}</div></div>
      </div>
      <div class="datas">
        <div class="data-col">
          <div class="dc-lbl lbl-saida">↑ Saída</div>
          <div class="dc-data">${s.data||'—'}</div>
          <div class="dc-hora">${s.hora||'—'}</div>
        </div>
        <div class="data-col">
          <div class="dc-lbl lbl-dev">↓ Devolução</div>
          ${dev?`<div class="dc-data">${e.data||'—'}</div><div class="dc-hora">${e.hora||'—'}</div>`:`<div class="dc-nd">Não devolvido</div>`}
        </div>
      </div>
      ${dias?`<div class="tempo">⏱️ Tempo de uso: <strong style="color:var(--gold2)">${dias}</strong></div>`:''}
      ${s.obs?`<div class="obs">💬 ${s.obs}</div>`:''}
    </div>`;
  }).join('');
}

function gerarCSV(){
  const pares=getPares();
  let c='ITEM,TIPO,QTD,FUNCIONÁRIO,OBRA,RESPONSÁVEL,DATA SAÍDA,HORA SAÍDA,DATA DEVOLUÇÃO,HORA DEVOLUÇÃO,DIAS USO,STATUS\n';
  c+=pares.map(({s,e,dev})=>{
    let dias='';
    if(dev&&e){const ds=parseD(s.created_at||s.data),de=parseD(e.created_at||e.data);dias=Math.ceil((de-ds)/(1000*60*60*24));}
    return[s._i||'',s._c==='epi'?(s.cat||'EPI'):(s.tipo||s.tipo_ferramenta||'FERRAMENTA'),s._q,s.funcionario||'',s.obra||'',s.responsavel||'',s.data||'',s.hora||'',dev?(e.data||''):'NÃO DEVOLVIDO',dev?(e.hora||''):'',dias,dev?'DEVOLVIDO':'EM ABERTO'].join(',');
  }).join('\n');
  return c;
}

function abrirSheets(){
  const pares=getPares();
  if(!pares.length){alert('Nenhum registro!');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+gerarCSV()],{type:'text/csv;charset=utf-8;'}));
  a.download=`proalmoxarife-${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;
  a.click();
  setTimeout(()=>window.open('https://sheets.new','_blank'),600);
  document.getElementById('smsg').style.display='block';
}

function baixarCSV(){
  const pares=getPares();
  if(!pares.length){alert('Nenhum registro!');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+gerarCSV()],{type:'text/csv;charset=utf-8;'}));
  a.download=`registro-${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;
  a.click();
}

document.getElementById('f-status').onchange=render;
document.getElementById('f-periodo').onchange=render;
document.getElementById('f-obra').onchange=render;
document.getElementById('f-func').onchange=render;
document.getElementById('busca').oninput=render;

load();
</script>
</body>
</html>
